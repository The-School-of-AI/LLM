data:
  loader_type: "bin_idx"
  shard_dir: ../_data/wikitext_shards/
  eval_shard_dir: null
  tokenizer_dir: ../_data/tokenizer
  validate_tokenizer: true
  dataset_name: "wikitext"
  dataset_config: "wikitext-103-raw-v1"
  tokenize_num_proc: 8
  max_length: 4096
  num_workers: 16
  tokenized_dataset_path: null
  dataset_cache_dir: null
  local_nvme_cache_dir: null
  require_local_nvme: false
  pack_into_blocks: true
  block_sizes: [4096]
  block_size_counts: null
  domain_column: null
  concat_across_domains: false
  drop_remainder: true

training:
  num_epochs: 1
  max_train_steps: 20
  max_eval_steps: null
  log_interval: 1
  seed: 42
  init_model_path: "../_data/results/init/model_init.pt"
  require_gsa_triton: true
  require_fused_kernels: false
  use_fused_ce: true
  max_chunk_gb: 16
  metrics_jsonl_path: "../_data/results/run/metrics.jsonl"
  # Kernel profiler: list global step numbers to profile (e.g. [10, 11, 12]).
  # Outputs profile_report.txt + profile.jsonl next to metrics_jsonl_path.
  # Set to [] or omit to disable (zero overhead when disabled).
  profile_steps: [1, 2, 3]

deepspeed:
  config_path: "deepspeed_config.json"
  local_rank: -1

model:
  tokenizer_name: ../_data/tokenizer
  embedding_type: "kronecker"
  model_variant: "reversible"

checkpoint:
  output_dir: "../_data/results/run/checkpoints"
  save_checkpoint: false
  checkpoint_interval: 500
  keep_last_n_checkpoints: 2
  resume_from_checkpoint: null
  resume_step: null

s3:
  enabled: false
  bucket: null
  prefix: "training/checkpoints"
  region: "us-east-1"
  cleanup_after_upload: false

generation:
  test_generation: false
  generation_prompt: "The history of artificial intelligence begins with"

# OPUS Data Selection (arXiv:2602.05400)
# When enabled, each training step scores N candidate samples and trains on
# the best rho*N samples, guided by AdamW preconditioner geometry.
opus:
  enabled: false
  selection_mode: "opus"
  candidate_multiplier: 2
  selection_ratio: 0.5
  score_seq_len: 512
  proxy_batch_size: 8
  sketch_dim: 8192
  temperature: 0.9
  sketch_seed: 42
  fallback_random_on_error: true
  max_selector_time_s: 30.0
  include_embeddings: false
  include_lm_head: false
  track_nonfinite_stats: true
  zero2_exact_global_scoring: false
  strict_shard_preconditioner: false
  log_selection_metrics: true
