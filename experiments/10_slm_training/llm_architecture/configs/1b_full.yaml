# =============================================================================
# LLM 1B FULL - All Advanced Features Enabled
# =============================================================================
# Combines: GSA + YaRN + mHC + MTP
# Maximum capability configuration for research/ablation
# Parameters: ~1.1B + auxiliary components
# =============================================================================

model_name: "LLM-1B-Full"
model_version: "1.0.0"

# Core architecture
vocab_size: 50304
hidden_size: 2048
num_hidden_layers: 24
max_position_embeddings: 32768      # Extended context

# Normalization
rms_norm_eps: 1.0e-6
use_pre_norm: true

# Initialization & Dropout
initializer_range: 0.02
hidden_dropout: 0.0
dtype: "bfloat16"

# -----------------------------------------------------------------------------
# Attention Configuration - GATED SPARSE
# -----------------------------------------------------------------------------
attention:
  attention_type: "gated_sparse"     # GSA for sparse attention patterns
  num_attention_heads: 16
  num_key_value_heads: 4
  head_dim: 128
  attention_dropout: 0.0
  attention_bias: false
  
  # GSA parameters (active - paper 2601.15305v1)
  gsa_indexer_dim: 64                # d_I: Low-dim indexer projection
  gsa_num_indexer_heads: 4           # H_I: Number of indexer heads
  gsa_k_base: 2048                   # Base selection budget
  gsa_k_min: 256                     # Minimum k (high confidence)
  gsa_k_max: 4096                    # Maximum k (low confidence)
  
  # DeepSeek parameters (available for switching)
  ds_compressed_dim: 512
  ds_rope_head_dim: 32
  ds_num_shared_experts: 1
  ds_q_lora_rank: 0

# -----------------------------------------------------------------------------
# Position Embedding Configuration - YARN
# -----------------------------------------------------------------------------
position:
  position_type: "yarn"              # Extended context
  rope_theta: 10000.0
  rope_scaling_factor: 1.0
  yarn_scale: 8.0                    # 8x context extension
  yarn_original_max_position: 4096
  yarn_beta_fast: 32.0
  yarn_beta_slow: 1.0
  yarn_mscale: 1.0
  yarn_mscale_all_dim: 0.0

# -----------------------------------------------------------------------------
# Feed-Forward Network Configuration
# -----------------------------------------------------------------------------
ffn:
  ffn_type: "swiglu"
  intermediate_size: 5504
  ffn_dropout: 0.0
  ffn_bias: false
  moe_num_experts: 8
  moe_num_experts_per_tok: 2
  moe_aux_loss_coef: 0.01

# -----------------------------------------------------------------------------
# Connection Configuration - MANIFOLD HYPER-CONNECTIONS
# -----------------------------------------------------------------------------
connection:
  connection_type: "mhc"             # Advanced residual connections
  mhc_expansion_rate: 4              # n: number of streams (paper uses 4)
  mhc_alpha_init: 0.01               # α: gating factor init (paper uses 0.01)
  mhc_sinkhorn_iters: 20             # Sinkhorn-Knopp iterations (paper uses 20)

# -----------------------------------------------------------------------------
# Output Head Configuration - MULTI-TOKEN PREDICTION
# -----------------------------------------------------------------------------
head:
  use_multi_token_prediction: true   # Predict multiple tokens
  num_predict_tokens: 4
  mtp_loss_weight: 0.3
  tie_word_embeddings: true
