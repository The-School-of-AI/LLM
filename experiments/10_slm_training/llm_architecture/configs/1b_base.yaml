# =============================================================================
# LLM 1B Base Configuration
# =============================================================================
# Dense model with Grouped Query Attention (GQA)
# Similar to Qwen3/LLaMA3 architecture
# Parameters: ~1.1B
# =============================================================================

# Model identification
model_name: "LLM-1B-Base"
model_version: "1.0.0"

# Core architecture
vocab_size: 50304          # Divisible by 64 for efficiency
hidden_size: 2048
num_hidden_layers: 24
max_position_embeddings: 4096

# Normalization
rms_norm_eps: 1.0e-6
use_pre_norm: true         # Pre-LayerNorm (modern standard)

# Initialization
initializer_range: 0.02

# Dropout
hidden_dropout: 0.0

# Precision
dtype: "bfloat16"          # Options: bfloat16, float16, float32

# -----------------------------------------------------------------------------
# Attention Configuration
# -----------------------------------------------------------------------------
attention:
  attention_type: "grouped_query"    # Options: grouped_query, gated_sparse, deepseek_sparse
  num_attention_heads: 16
  num_key_value_heads: 4             # 4:1 ratio for GQA (16/4 = 4x memory reduction)
  head_dim: 128
  attention_dropout: 0.0
  attention_bias: false
  
  # GSA specific (unused in base)
  gsa_num_slots: 64
  gsa_slot_dim: 64
  gsa_num_gating_heads: 4
  gsa_temperature: 1.0
  gsa_sparse_topk: 32
  
  # DeepSeek specific (unused in base)
  ds_compressed_dim: 512
  ds_rope_head_dim: 32
  ds_num_shared_experts: 1
  ds_q_lora_rank: 0

# -----------------------------------------------------------------------------
# Position Embedding Configuration
# -----------------------------------------------------------------------------
position:
  position_type: "rope"              # Options: rope, yarn, alibi
  rope_theta: 10000.0
  rope_scaling_factor: 1.0
  
  # YaRN specific (unused in base)
  yarn_scale: 1.0
  yarn_original_max_position: 4096
  yarn_beta_fast: 32.0
  yarn_beta_slow: 1.0
  yarn_mscale: 1.0
  yarn_mscale_all_dim: 0.0

# -----------------------------------------------------------------------------
# Feed-Forward Network Configuration
# -----------------------------------------------------------------------------
ffn:
  ffn_type: "swiglu"                 # Options: swiglu, gelu, moe
  intermediate_size: 5504            # ~2.7x hidden_size for SwiGLU
  ffn_dropout: 0.0
  ffn_bias: false
  
  # MoE specific (unused in base)
  moe_num_experts: 8
  moe_num_experts_per_tok: 2
  moe_aux_loss_coef: 0.01

# -----------------------------------------------------------------------------
# Connection Configuration
# -----------------------------------------------------------------------------
connection:
  connection_type: "residual"        # Options: residual, mhc
  
  # mHC specific (unused in base)
  mhc_expansion_rate: 4.0
  mhc_num_connections: 2
  mhc_use_dynamic_weights: true
  mhc_manifold_dim: 64

# -----------------------------------------------------------------------------
# Output Head Configuration
# -----------------------------------------------------------------------------
head:
  use_multi_token_prediction: false
  num_predict_tokens: 1
  mtp_loss_weight: 0.3
  tie_word_embeddings: true
