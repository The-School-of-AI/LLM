# =============================================================================
# LLM 1B Base Configuration
# =============================================================================
# Dense model with Grouped Query Attention (GQA)
# Similar to Qwen3/LLaMA3 architecture
# Parameters: ~1.1B
# =============================================================================

# Model identification
model_name: "LLM-1B-Base"
model_version: "1.0.0"

# Core architecture
vocab_size: 50304          # Divisible by 64 for efficiency
hidden_size: 2048
num_hidden_layers: 24
max_position_embeddings: 4096

# Normalization
rms_norm_eps: 1.0e-6
use_pre_norm: true         # Pre-LayerNorm (modern standard)

# Initialization
initializer_range: 0.02

# Dropout
hidden_dropout: 0.0

# Precision
dtype: "bfloat16"          # Options: bfloat16, float16, float32

# -----------------------------------------------------------------------------
# Attention Configuration
# -----------------------------------------------------------------------------
attention:
  attention_type: "grouped_query"    # Options: grouped_query, gated_sparse, deepseek_sparse
  num_attention_heads: 16
  num_key_value_heads: 4             # 4:1 ratio for GQA (16/4 = 4x memory reduction)
  head_dim: 128
  attention_dropout: 0.0
  attention_bias: false
  
  # GSA specific (unused in base)
  gsa_indexer_dim: 64             # d_I: Low-dim indexer projection
  gsa_num_indexer_heads: 4         # H_I: Number of indexer heads
  gsa_k_base: 2048                 # Base selection budget
  gsa_k_min: 256                   # Minimum k (high confidence)
  gsa_k_max: 4096                  # Maximum k (low confidence)
  
  # DeepSeek specific (unused in base)
  ds_compressed_dim: 512
  ds_rope_head_dim: 32
  ds_num_shared_experts: 1
  ds_q_lora_rank: 0

# -----------------------------------------------------------------------------
# Position Embedding Configuration
# -----------------------------------------------------------------------------
position:
  position_type: "rope"              # Options: rope, yarn, alibi
  rope_theta: 10000.0
  rope_scaling_factor: 1.0
  
  # YaRN specific (unused in base)
  yarn_scale: 1.0
  yarn_original_max_position: 4096
  yarn_beta_fast: 32.0
  yarn_beta_slow: 1.0
  yarn_mscale: 1.0
  yarn_mscale_all_dim: 0.0

# -----------------------------------------------------------------------------
# Feed-Forward Network Configuration
# -----------------------------------------------------------------------------
ffn:
  ffn_type: "swiglu"                 # Options: swiglu, gelu, moe
  intermediate_size: 5504            # ~2.7x hidden_size for SwiGLU
  ffn_dropout: 0.0
  ffn_bias: false
  
  # MoE specific (unused in base)
  moe_num_experts: 8
  moe_num_experts_per_tok: 2
  moe_aux_loss_coef: 0.01

# -----------------------------------------------------------------------------
# Connection Configuration
# -----------------------------------------------------------------------------
connection:
  connection_type: "residual"        # Options: residual, mhc
  
  # mHC specific (unused in base)
  mhc_expansion_rate: 4            # n: number of streams (paper uses 4)
  mhc_alpha_init: 0.01             # α: gating factor init (paper uses 0.01)
  mhc_sinkhorn_iters: 20           # Sinkhorn-Knopp iterations (paper uses 20)

# -----------------------------------------------------------------------------
# Output Head Configuration
# -----------------------------------------------------------------------------
head:
  use_multi_token_prediction: false
  num_predict_tokens: 1
  mtp_loss_weight: 0.3
  tie_word_embeddings: true

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  max_steps: 10000
  max_epochs: null
  batch_size: 8
  gradient_accumulation_steps: 4
  seq_length: 1024
  
  # Optimizer
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  
  # LR Schedule
  warmup_steps: 500
  lr_decay_style: "cosine"         # Options: cosine, linear, constant
  
  # Regularization
  gradient_clip: 1.0
  dropout: 0.0
  
  # Precision
  use_amp: true
  amp_dtype: "bfloat16"            # Options: bfloat16, float16
  
  # Device
  device: "auto"                   # Options: auto, cuda, mps, cpu
  
  # Checkpointing
  save_interval: 1000
  checkpoint_dir: "./checkpoints/1b_base"
  
  # Logging
  log_interval: 10
  eval_interval: 500
  
  # Experiment
  experiment_name: "1b_base"
  seed: 42

# =============================================================================
# End of Configuration
# =============================================================================
  use_multi_token_prediction: false
  num_predict_tokens: 1
  mtp_loss_weight: 0.3
  tie_word_embeddings: true
