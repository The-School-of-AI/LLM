[project]
name = "sft-preprocessing-pipeline"
version = "0.1.0"
description = "SFT Preprocessing Pipeline — Team 18"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core data processing
    "datasets>=2.18.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    # Configuration & CLI
    "pyyaml>=6.0",
    "click>=8.1.0",
    # Tokenization
    "transformers>=4.40.0",
    "tokenizers>=0.15.0",
    # Near-dedup (MinHash LSH)
    "datasketch>=1.6.4",
    # Language detection
    "langdetect>=1.0.9",
    # S3 upload
    "boto3>=1.34.0",
    # Utilities
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
managed = true
