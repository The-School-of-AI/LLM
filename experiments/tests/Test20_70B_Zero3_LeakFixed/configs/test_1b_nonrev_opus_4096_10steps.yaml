  generation_prompt: The history of artificial intelligence begins with

# OPUS data selection configuration
# 64 candidates (8/GPU), 8 proxy (1/GPU), rho=0.5 → select 32, train 8 (1/GPU)
# Scoring: (8+1)*512 = 4608 tokens/GPU.  Training: 1*4096 = 4096 tokens/GPU.
opus:
  enabled: true
  candidate_multiplier: 8    # 8/GPU = 64 global candidates
  n_proxy: 1                 # 1/GPU = 8 global proxy (paper K_proxy=8)
  proxy_seq_len: 512         # scoring at 512 tokens
  sketch_dim: 8192           # paper m=8192
  temperature: 0.9           # paper tau=0.9
  sketch_seed: 42
  selection_ratio: 0.5       # rho=0.5 → select 32 from 64
  max_selector_time_s: 30.0
  fallback_random_on_error: true
  train_batch: 1             # 1/GPU = 8 global @ 4096 tokens
  score_interval: 3          # score every 3rd step, random selection in between
