# 8B MoE LoRA config for Phase 1 testing (profiling + DeltaNet opts).
# Use with: CFG=configs/test_8b_moe_lora_4096_bs32_10steps.yaml ./run.sh
# See TESTING_PLAN.md for env vars (T17_DN_USE_FUSED_QKVG, T17_DN_USE_DELTA_ENTRANCE).
data:
  loader_type: bin_idx
  shard_dir: /mnt/local-nvme/LLM/experiments/tests/Test17_3B_Zero3/data/wikitext_shards/
  eval_shard_dir: null
  tokenizer_dir: src/tokenizer
  validate_tokenizer: true
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenize_num_proc: 8
  max_length: 4096
  num_workers: 16
  tokenized_dataset_path: null
  dataset_cache_dir: null
  local_nvme_cache_dir: null
  require_local_nvme: false
  pack_into_blocks: true
  block_sizes:
  - 4096
  block_size_counts: null
  domain_column: null
  concat_across_domains: false
  drop_remainder: true
training:
  num_epochs: 1
  max_train_steps: 20
  max_eval_steps: null
  log_interval: 1
  seed: 42
  init_model_path: null
  require_gsa_triton: true
  require_fused_kernels: false
  use_fused_ce: true
  max_chunk_gb: 1
  metrics_jsonl_path: ../results/8b_run/metrics.jsonl
  # Profiling enabled for Phase 1 (kernel timing). Set to [] for throughput-only runs.
  profile_steps: [1, 2, 3, 4, 5]
deepspeed:
  config_path: ../deepspeed/zero-3-70b-moe-lora-bs32.json
  local_rank: -1
model:
  tokenizer_name: null
  embedding_type: kronecker
  model_variant: reversible
  model_name: 8bmoe
  moe_t4_enabled: false
  moe_t4_dispatcher: deepep
  moe_expert_parallel_size: 1
  deltanet_use_fused_entry: false
lora:
  enabled: true
  rank: 16
  alpha: 32.0
  dropout: 0.0
  use_fused: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - W_q
    - W_k
    - W_v
checkpoint:
  output_dir: ../results/8b_run/checkpoints
  save_checkpoint: false
  checkpoint_interval: 500
  keep_last_n_checkpoints: 2
  resume_from_checkpoint: null
  resume_step: null
s3:
  enabled: false
  bucket: null
  prefix: training/checkpoints
  region: us-east-1
  cleanup_after_upload: false
generation:
  test_generation: false
  generation_prompt: The history of artificial intelligence begins with
