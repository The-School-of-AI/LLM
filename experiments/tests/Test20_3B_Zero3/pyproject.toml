[project]
name = "template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.1.0",
    "boto3>=1.42.39",
    "botocore>=1.42.39",
    "datasets>=4.5.0",
    "deepspeed==0.18.6",
    "isort>=7.0.0",
    "mpi4py>=4.1.1",
    "nvidia-ml-py>=13.590.48",
    "pynvml>=13.0.1",
    "pandas>=3.0.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers>=5.0.0",
    "triton==3.6.0",
    "flash-linear-attention>=0.4.1",
    "pyarrow>=10.0.0",
    "spdl>=0.2.0",
    "numpy>=1.21.0",
    "setuptools",
    "grouped-gemm==0.3.0",
    "einops==0.8.2",
    "ninja",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
flash-linear-attention = { git = "https://github.com/sustcsonglin/flash-linear-attention", rev = "d792da6dd544d28980205817b20535500c3f243e" }

[tool.uv]
override-dependencies = ["triton==3.6.0"]