# Experiment 3: SVD Expert Compression — Analysis Run
# Purpose: Analyze singular value spectrum of 70B MoE expert weights
#          to determine optimal target rank for SVD compression.
#
# This is an analysis-only run: it loads the model, computes SVD of
# expert weights, reports effective ranks at various thresholds, then
# proceeds with normal training (no compression applied).
#
# After reviewing the rank report, set svd.analyze_only=false and
# svd.target_rank to the chosen rank for the actual compression run.
#
# Run:
#   T17_DN_USE_DELTA_ENTRANCE=1 deepspeed --num_gpus=8 code/main.py \
#     --config configs/exp3_svd_70b_analysis.yaml
data:
  loader_type: bin_idx
  shard_dir: /mnt/local-nvme/data/d1_shards/
  eval_shard_dir: null
  tokenizer_dir: src/tokenizer
  validate_tokenizer: true
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenize_num_proc: 8
  max_length: 4096
  num_workers: 16
  tokenized_dataset_path: null
  dataset_cache_dir: null
  local_nvme_cache_dir: null
  require_local_nvme: false
  pack_into_blocks: true
  block_sizes:
  - 4096
  block_size_counts: null
  domain_column: null
  concat_across_domains: false
  drop_remainder: true
training:
  num_epochs: 1
  max_train_steps: 10
  max_eval_steps: null
  log_interval: 1
  seed: 42
  init_model_path: null
  require_gsa_triton: true
  require_fused_kernels: false
  use_fused_ce: true
  max_chunk_gb: 1
  metrics_jsonl_path: ../results/exp3_svd/metrics.jsonl
  profile_steps: []
deepspeed:
  config_path: ../deepspeed/zero-3-70b-moe-lora-bs32-tight.json
  local_rank: -1
model:
  tokenizer_name: null
  embedding_type: kronecker
  model_variant: reversible
  model_name: 70bmoe
  moe_t4_enabled: false
  moe_t4_dispatcher: deepep
  moe_expert_parallel_size: 1
lora:
  enabled: true
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - W_q
    - W_k
    - W_v
    - W_gv
    - W_go
    - W_Iq
    - W_Ik
    - W_Iw
    - shared_gate
    - shared_up
    - shared_down
    - gate
  moe_enabled: true
  moe_rank: 8
  moe_alpha: 16.0
  moe_target_params:
    - W_gate
    - W_up
    - W_down
nf4:
  enabled: false
svd:
  enabled: true
  analyze_only: true
  target_rank: 64
  analyze_ranks: [8, 16, 32, 64, 128, 256]
  # Analyze 10 experts per layer (not all 260) for speed
  max_experts_analyze: 10
checkpoint:
  output_dir: ../results/exp3_svd/checkpoints
  save_checkpoint: false
  checkpoint_interval: 500
  keep_last_n_checkpoints: 2
  resume_from_checkpoint: null
  resume_step: null
s3:
  enabled: false
  bucket: null
  prefix: training/checkpoints
  region: us-east-1
  cleanup_after_upload: false
generation:
  test_generation: false
  generation_prompt: The history of artificial intelligence begins with
