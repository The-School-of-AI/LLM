# Experiment 2.1 (8B MoE proxy): NF4 QLoRA + Tight ZeRO-3 Buffers
# Proxy run for the 70B NF4 experiment — validates NF4 quantization on smaller model.
# 8B MoE: 20 experts (vs 260), top-k=2 (vs 8), same backbone (4096 hidden, 20 layers)
#
# Strategy: 4-bit NF4 quantization of MoE expert base weights.
# Validates that NF4 dequant-on-the-fly works correctly with LoRA and
# produces stable loss before committing to 70B GPU time.
#
# Run:
#   T17_DN_USE_DELTA_ENTRANCE=1 T19_NF4_MOE=1 deepspeed --num_gpus=8 code/main.py \
#     --config configs/exp2_1_8bmoe_nf4_qlora_tight.yaml
data:
  loader_type: bin_idx
  shard_dir: /mnt/local-nvme/data/d1_shards/
  eval_shard_dir: null
  tokenizer_dir: src/tokenizer
  validate_tokenizer: true
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenize_num_proc: 8
  max_length: 4096
  num_workers: 16
  tokenized_dataset_path: null
  dataset_cache_dir: null
  local_nvme_cache_dir: null
  require_local_nvme: false
  pack_into_blocks: true
  block_sizes:
  - 4096
  block_size_counts: null
  domain_column: null
  concat_across_domains: false
  drop_remainder: true
training:
  num_epochs: 1
  max_train_steps: 10
  max_train_seconds: null
  max_eval_steps: null
  log_interval: 1
  seed: 42
  init_model_path: null
  require_gsa_triton: true
  require_fused_kernels: false
  use_fused_ce: true
  max_chunk_gb: 4
  metrics_jsonl_path: ../results/exp2_1_8b/metrics.jsonl
  profile_steps: []
  enable_system_metrics: false
deepspeed:
  config_path: ../deepspeed/zero-3-8bmoe-lora-tight.json
  local_rank: -1
model:
  embedding_type: kronecker
  model_name: 8bmoe
  model_variant: reversible
  moe_t4_enabled: false
  moe_t4_dispatcher: deepep
  moe_expert_parallel_size: 1
lora:
  enabled: true
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules:
    # DeltaNet attention (15 layers)
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    # GSA attention (5 layers)
    - W_q
    - W_k
    - W_v
    # GSA sigmoid gates (5 layers)
    - W_gv
    - W_go
    # GSA indexer projections (5 layers)
    - W_Iq
    - W_Ik
    - W_Iw
    # Shared expert FFN (always active, every layer)
    - shared_gate
    - shared_up
    - shared_down
    # MoE router
    - gate
  moe_enabled: true
  moe_rank: 8
  moe_alpha: 16.0
  moe_target_params:
    - W_gate
    - W_up
    - W_down
nf4:
  enabled: true
  block_size: 64
  double_quant: true
  quantize_experts: true
checkpoint:
  output_dir: ../results/exp2_1_8b/checkpoints
  save_checkpoint: false
  checkpoint_interval: 500
  keep_last_n_checkpoints: 2
  resume_from_checkpoint: null
  resume_step: null
s3:
  enabled: false
  bucket: null
  prefix: training/checkpoints
  region: us-east-1
  cleanup_after_upload: false
generation:
  test_generation: false
  generation_prompt: The history of artificial intelligence begins with
