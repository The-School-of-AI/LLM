s3:
  bucket: "t2-datacurriculum-353"
  base_prefix: "processed_dataset/curriculum_data"
  region: "us-east-1"

processing:
  batch_size: 100
  max_workers: 4      # Number of parallel workers for I/O and transformation
  default_bands: ["B0", "B1", "B2", "B3", "B4", "B5"]
  
schema:
  rename_columns:
    uuid: "chunk_id"
  # Active band columns are handled dynamically (band_p_<BAND> -> band_score)
  drop_columns:
    - "id"
    - "text"
    - "hash"
    - "metadata"
    - "assigned_band"
    - "file_path"

output:
  mode: "per_band"  # Options: "single", "per_band", "sharded"
  dir: "output"
  shard_size: 50000 # Number of records per shard for "sharded" mode
  
logging:
  level: "INFO"
  log_file: "pipeline.log"
