name: Coreset Engine Pipeline

on:
  workflow_dispatch:
    inputs:
      num_shards:
        description: 'Number of parallel shards'
        required: true
        default: '8'
      stages:
        description: 'Space-separated stage list'
        required: true
        default: '1B'
      input_path:
        description: 'S3 input path'
        required: true
        default: 's3://<container-name>/processed_dataset/curriculum_pyspark_output/'
      total_tokens:
        description: 'Total tokens estimate'
        required: false
        default: '4523096944'
      resume:
        description: 'Resume from last checkpoints'
        type: boolean
        default: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          cd experiments/3_coreset_engineering/
          uv sync --dev

      - name: Run tests
        run: |
          cd experiments/3_coreset_engineering/
          uv run pytest coreset_engine_v5/tests/

  pipeline-run:
    name: Run Coreset Pipeline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Automated Script
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          S3_INPUT_PATH: ${{ github.event.inputs.input_path }}
          NUM_SHARDS: ${{ github.event.inputs.num_shards }}
          STAGES: ${{ github.event.inputs.stages }}
          TOTAL_TOKENS: ${{ github.event.inputs.total_tokens }}
          RESUME: ${{ github.event.inputs.resume }}
        run: |
          chmod +x experiments/3_coreset_engineering/coreset_engine_v5/commands.sh
          # CI is already in the repo, so we run the script directly
          bash experiments/3_coreset_engineering/coreset_engine_v5/commands.sh
