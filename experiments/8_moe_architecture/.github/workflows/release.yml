name: Release Coresets

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Package manifests
      run: |
        mkdir -p release
        tar -czf release/manifests.tar.gz outputs/manifests/
        tar -czf release/validation_reports.tar.gz outputs/validation_reports/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/manifests.tar.gz
          release/validation_reports.tar.gz
        body: |
          ## Coreset Release
          
          Stage-specific coresets with manifests and validation reports.
          
          **Total tokens**: ~400B across 4 stages
          
          Co-Authored-By: Warp <agent@warp.dev>
