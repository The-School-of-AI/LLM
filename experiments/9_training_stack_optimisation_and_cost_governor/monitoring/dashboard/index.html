<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: #0d1117;
            --card: #111820;
            --border: #1e2a38;
            --border2: #2a3a50;
            --text: #c9d8e8;
            --muted: #4a6080;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --green: #00e5a0;
            --yellow: #f5a623;
            --red: #ff4d6a;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.75rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-family: var(--mono);
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.03em;
        }

        .logo span {
            color: var(--muted);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--muted);
        }

        .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: pulse 2s infinite;
        }

        .pulse.off {
            background: var(--muted);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.3
            }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .refresh-bar {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.45rem;
            padding: 0.3rem 0.65rem;
        }

        .refresh-label {
            font-size: 0.68rem;
            color: var(--muted);
            font-family: var(--mono);
        }

        .refresh-select {
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: var(--mono);
            font-size: 0.68rem;
            cursor: pointer;
            outline: none;
        }

        .refresh-select option {
            background: var(--card);
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.8rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border2);
            background: var(--card);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* LAYOUT */
        .layout {
            display: grid;
            grid-template-columns: 270px 1fr;
            height: calc(100vh - 53px);
        }

        /* SIDEBAR */
        .sidebar {
            border-right: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section {
            border-bottom: 1px solid var(--border);
            padding: 0.9rem;
        }

        .sidebar-title {
            font-family: var(--mono);
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.6rem;
        }

        .compare-hint {
            font-size: 0.63rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .compare-active-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 0.4rem;
            padding: 0.35rem 0.6rem;
            margin-bottom: 0.5rem;
        }

        .compare-active-label {
            font-family: var(--mono);
            font-size: 0.63rem;
            color: #a78bfa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .compare-clear {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 0.2rem;
            flex-shrink: 0;
        }

        .compare-clear:hover {
            color: var(--red);
        }

        /* RUN LIST */
        .run-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow-y: auto;
            max-height: 260px;
        }

        .run-item {
            padding: 0.5rem 0.65rem;
            border-radius: 0.4rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.12s;
            position: relative;
        }

        .run-item:hover {
            background: var(--card);
            border-color: var(--border);
        }

        .run-item.active {
            background: rgba(0, 212, 255, 0.07);
            border-color: rgba(0, 212, 255, 0.25);
        }

        .run-item.compare-sel {
            background: rgba(124, 58, 237, 0.07);
            border-color: rgba(124, 58, 237, 0.25);
        }

        .run-name {
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
            padding-right: 2rem;
        }

        .run-meta {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .badge {
            font-family: var(--mono);
            font-size: 0.58rem;
            padding: 0.08rem 0.35rem;
            border-radius: 0.2rem;
            font-weight: 600;
        }

        .badge-running {
            background: rgba(0, 229, 160, 0.12);
            color: var(--green);
        }

        .badge-done,
        .badge-completed {
            background: rgba(74, 96, 128, 0.18);
            color: var(--muted);
        }

        .badge-failed {
            background: rgba(255, 77, 106, 0.12);
            color: var(--red);
        }

        .badge-unknown {
            background: rgba(74, 96, 128, 0.18);
            color: var(--muted);
        }

        .run-model {
            font-size: 0.62rem;
            color: var(--muted);
        }

        .run-tag {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--mono);
            font-size: 0.58rem;
            font-weight: 700;
        }

        .run-tag.a {
            color: var(--accent);
        }

        .run-tag.b {
            color: #a78bfa;
        }

        /* METRIC SELECTOR */
        .metric-search-wrap {
            padding: 0.9rem 0.9rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .metric-search {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.4rem;
            padding: 0.38rem 0.6rem;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.68rem;
            outline: none;
        }

        .metric-search:focus {
            border-color: var(--accent);
        }

        .metric-search::placeholder {
            color: var(--muted);
        }

        .metric-scroll {
            overflow-y: auto;
            flex: 1;
            padding: 0.75rem;
        }

        .metric-category {
            margin-bottom: 0.9rem;
        }

        .cat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.35rem;
        }

        .cat-name {
            font-family: var(--mono);
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .cat-actions {
            display: flex;
            gap: 0.2rem;
        }

        .cat-btn {
            font-family: var(--mono);
            font-size: 0.58rem;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.1rem 0.3rem;
            border-radius: 0.2rem;
        }

        .cat-btn:hover {
            color: var(--accent);
            background: rgba(0, 212, 255, 0.07);
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.28rem 0.35rem;
            border-radius: 0.3rem;
            cursor: pointer;
        }

        .metric-item:hover {
            background: var(--card);
        }

        .metric-item input {
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .metric-item label {
            font-family: var(--mono);
            font-size: 0.67rem;
            color: var(--text);
            cursor: pointer;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kind-badge {
            font-size: 0.53rem;
            padding: 0.05rem 0.28rem;
            border-radius: 0.2rem;
            font-family: var(--mono);
            flex-shrink: 0;
        }

        .kind-scalar {
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent);
        }

        .kind-array {
            background: rgba(124, 58, 237, 0.12);
            color: #a78bfa;
        }

        /* MAIN */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            padding: 0 1.5rem;
        }

        .tab {
            font-family: var(--mono);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 0.8rem 1.1rem;
            cursor: pointer;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .panel {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .panel.active {
            display: block;
        }

        /* CHARTS */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 1rem;
        }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            padding: 1.1rem;
            transition: border-color 0.2s;
        }

        .chart-card:hover {
            border-color: var(--border2);
        }

        .chart-name {
            font-family: var(--mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.55rem;
        }

        .chart-stats-row {
            display: flex;
            gap: 1.1rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }

        .cstat {
            display: flex;
            flex-direction: column;
        }

        .cstat-label {
            font-family: var(--mono);
            font-size: 0.55rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .cstat-value {
            font-family: var(--mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
        }

        .chart-hint {
            font-size: 0.6rem;
            color: var(--muted);
            margin-bottom: 0.45rem;
            font-family: var(--mono);
        }

        .chart-wrapper {
            position: relative;
            height: 220px;
        }

        .compare-legend {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.45rem;
        }

        .leg {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-family: var(--mono);
            font-size: 0.62rem;
            color: var(--muted);
        }

        .leg-line {
            width: 18px;
            height: 2px;
            border-radius: 1px;
        }

        /* EVENTS */
        .events-header {
            display: grid;
            grid-template-columns: 150px 70px 110px 80px 1fr;
            gap: 0.6rem;
            padding: 0.35rem 0.65rem;
            font-family: var(--mono);
            font-size: 0.58rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .event-row {
            display: grid;
            grid-template-columns: 150px 70px 110px 80px 1fr;
            gap: 0.6rem;
            align-items: center;
            padding: 0.55rem 0.65rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.4rem;
            font-family: var(--mono);
            font-size: 0.67rem;
        }

        .event-time {
            color: var(--muted);
        }

        .event-step {
            color: var(--accent);
        }

        .event-type {
            color: var(--text);
            font-weight: 600;
        }

        .sev-info {
            color: var(--green);
        }

        .sev-warning {
            color: var(--yellow);
        }

        .sev-error {
            color: var(--red);
        }

        .event-msg {
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* EMPTY / LOADING */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3.5rem;
            color: var(--muted);
            gap: 0.6rem;
            text-align: center;
        }

        .empty-icon {
            font-size: 2rem;
            opacity: 0.35;
        }

        .empty-title {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text);
        }

        .empty-sub {
            font-size: 0.75rem;
            max-width: 280px;
            line-height: 1.6;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            background: var(--card);
            border: 1px solid var(--border2);
            border-radius: 0.45rem;
            padding: 0.5rem 0.9rem;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--text);
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.22s;
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px;
        }

        @media(max-width:860px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }

            .sidebar {
                max-height: 45vh;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-left">
            <div class="logo">train<span>/</span>watch</div>
            <div class="live-status">
                <div class="pulse off" id="liveDot"></div>
                <span id="liveLabel">live off</span>
            </div>
        </div>
        <div class="header-right">
            <div class="refresh-bar">
                <span class="refresh-label">auto-refresh</span>
                <select class="refresh-select" id="refreshInterval" onchange="setAutoRefresh()">
                    <option value="0">off</option>
                    <option value="5000">5s</option>
                    <option value="10000" selected>10s</option>
                    <option value="30000">30s</option>
                    <option value="60000">1m</option>
                </select>
            </div>
            <button class="btn" onclick="manualRefresh()">↺ Refresh</button>
            <button class="btn" id="compareBtn" onclick="toggleCompare()">⊕ Compare</button>
        </div>
    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Training Runs</div>
                <div class="compare-hint" id="compareHint">Click a run to select it.</div>
                <div id="compareBar" style="display:none"></div>
                <div class="run-list" id="runList">
                    <div class="empty" style="padding:1rem">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <div class="metric-search-wrap">
                <div class="sidebar-title" style="margin-bottom:0.5rem">Metrics</div>
                <input class="metric-search" id="metricSearch" placeholder="Search metrics…" oninput="filterMetrics()">
            </div>
            <div class="metric-scroll" id="metricScroll">
                <div class="empty" style="padding:1rem"><span style="font-size:0.72rem">Select a run first</span></div>
            </div>
        </div>

        <!-- MAIN -->
        <div class="main">
            <div class="tabs">
                <div class="tab active" id="tab-charts" onclick="switchTab('charts')">Charts</div>
                <div class="tab" id="tab-events" onclick="switchTab('events')">Events</div>
            </div>
            <div class="panel active" id="panel-charts">
                <div id="chartsContent">
                    <div class="empty">
                        <div class="empty-icon">⬡</div>
                        <div class="empty-title">Nothing selected</div>
                        <div class="empty-sub">Pick a run from the sidebar, then check metrics to chart</div>
                    </div>
                </div>
            </div>
            <div class="panel" id="panel-events">
                <div id="eventsContent">
                    <div class="empty">
                        <div class="empty-icon">◈</div>
                        <div class="empty-title">No run selected</div>
                        <div class="empty-sub">Select a run to see its event log</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        const COL_A = ['#00d4ff', '#00e5a0', '#f5a623', '#ff4d6a', '#a78bfa', '#34d399', '#fb923c', '#38bdf8'];
        const COL_B = ['#7c3aed', '#059669', '#b45309', '#be123c', '#6d28d9', '#065f46', '#9a3412', '#1e40af'];

        let primaryRun = null;
        let compareRun = null;
        let compareMode = false;
        let allMetrics = {};
        let chartInsts = {};
        let refreshTimer = null;

        Chart.defaults.color = '#4a6080';
        Chart.defaults.borderColor = '#1e2a38';

        async function init() { await loadRuns(); setAutoRefresh(); }

        // ─── RUNS ───
        async function loadRuns() {
            try {
                const data = await fetch(`${API}/api/runs`).then(r => r.json());
                renderRunList(data.runs || []);
            } catch (e) { showToast('⚠ Could not reach server'); }
        }

        function renderRunList(runs) {
            const el = document.getElementById('runList');
            if (!runs.length) { el.innerHTML = '<div class="empty" style="padding:0.75rem"><span style="font-size:0.7rem;color:var(--muted)">No runs found</span></div>'; return; }
            el.innerHTML = runs.map(r => {
                const isA = primaryRun?.run_id === r.run_id;
                const isB = compareRun?.run_id === r.run_id;
                const sc = { 'running': 'badge-running', 'done': 'badge-done', 'completed': 'badge-done', 'failed': 'badge-failed' }[r.status] || 'badge-unknown';
                return `<div class="run-item ${isA ? 'active' : ''} ${isB ? 'compare-sel' : ''}" onclick='selectRun(${JSON.stringify(r)})' title="${r.run_id}">
            <div class="run-name">${r.run_id}</div>
            <div class="run-meta">
                <span class="badge ${sc}">${r.status || 'unknown'}</span>
                ${r.model_name ? `<span class="run-model">${r.model_name}${r.model_size ? ' · ' + r.model_size : ''}</span>` : ''}
            </div>
            ${isA ? '<span class="run-tag a">A</span>' : isB ? '<span class="run-tag b">B</span>' : ''}
        </div>`;
            }).join('');
        }

        function selectRun(run) {
            if (compareMode) {
                if (run.run_id === primaryRun?.run_id) { showToast('⚠ Pick a different run for B'); return; }
                compareRun = run;
                updateCompareBar();
                loadRuns().then(generateCharts);
            } else {
                primaryRun = run;
                compareRun = null;
                loadRuns().then(discoverMetrics);
            }
        }

        // ─── COMPARE ───
        function toggleCompare() {
            compareMode = !compareMode;
            const btn = document.getElementById('compareBtn');
            btn.classList.toggle('active', compareMode);
            btn.textContent = compareMode ? '✕ Cancel' : '⊕ Compare';
            document.getElementById('compareHint').textContent = compareMode
                ? 'Now click a second run to compare (B).'
                : 'Click a run to select it.';
            if (!compareMode) { compareRun = null; updateCompareBar(); loadRuns().then(generateCharts); }
        }

        function updateCompareBar() {
            const bar = document.getElementById('compareBar');
            if (compareRun) {
                bar.style.display = 'flex';
                bar.innerHTML = `<span class="compare-active-label">B: ${compareRun.run_id}</span><button class="compare-clear" onclick="clearCompare()">✕</button>`;
            } else { bar.style.display = 'none'; }
        }

        function clearCompare() {
            compareRun = null; compareMode = false;
            document.getElementById('compareBtn').classList.remove('active');
            document.getElementById('compareBtn').textContent = '⊕ Compare';
            document.getElementById('compareHint').textContent = 'Click a run to select it.';
            updateCompareBar(); loadRuns().then(generateCharts);
        }

        // ─── METRICS ───
        async function discoverMetrics() {
            if (!primaryRun) return;
            document.getElementById('metricScroll').innerHTML = '<div class="empty" style="padding:1.5rem"><div class="spinner"></div></div>';
            try {
                const data = await fetch(`${API}/api/runs/${primaryRun.run_id}/metrics`).then(r => r.json());
                allMetrics = data.metrics || {};
                renderMetricSelector(allMetrics);
                loadEvents();
                showToast(`Loaded: ${primaryRun.run_id.substring(0, 24)}…`);
            } catch (e) { showToast('⚠ Failed to load metrics'); }
        }

        function renderMetricSelector(metrics, filter = '') {
            const el = document.getElementById('metricScroll');
            const low = filter.toLowerCase();
            let html = '', any = false;

            for (const [cat, items] of Object.entries(metrics)) {
                const vis = items.filter(m => { const n = typeof m === 'object' ? m.name : m; return !low || n.toLowerCase().includes(low); });
                if (!vis.length) continue;
                any = true;
                html += `<div class="metric-category">
            <div class="cat-header">
                <span class="cat-name">${cat}</span>
                <div class="cat-actions">
                    <button class="cat-btn" onclick="selCat('${cat}',true)">all</button>
                    <button class="cat-btn" onclick="selCat('${cat}',false)">none</button>
                </div>
            </div>`;
                vis.forEach(m => {
                    const name = typeof m === 'object' ? m.name : m;
                    const kind = typeof m === 'object' ? m.kind : 'scalar';
                    const id = `m-${name.replace(/[^a-zA-Z0-9]/g, '-')}`;
                    const prev = document.getElementById(id);
                    const chk = prev?.checked ? 'checked' : '';
                    html += `<div class="metric-item">
                <input type="checkbox" id="${id}" value="${name}" data-cat="${cat}" ${chk} onchange="generateCharts()">
                <label for="${id}">${name}</label>
                <span class="kind-badge kind-${kind}">${kind === 'array' ? 'hist' : 'val'}</span>
            </div>`;
                });
                html += '</div>';
            }
            el.innerHTML = any ? html : '<div class="empty" style="padding:1rem"><span style="font-size:0.7rem;color:var(--muted)">No metrics match</span></div>';
        }

        function filterMetrics() { renderMetricSelector(allMetrics, document.getElementById('metricSearch').value); }

        function selCat(cat, on) {
            document.querySelectorAll(`[data-cat="${cat}"]`).forEach(cb => cb.checked = on);
            generateCharts();
        }

        // ─── CHARTS ───
        async function generateCharts() {
            const sel = Array.from(document.querySelectorAll('#metricScroll input:checked')).map(c => c.value);
            const el = document.getElementById('chartsContent');

            Object.values(chartInsts).forEach(c => c.destroy());
            chartInsts = {};

            if (!sel.length || !primaryRun) {
                el.innerHTML = '<div class="empty"><div class="empty-icon">⬡</div><div class="empty-title">No metrics selected</div><div class="empty-sub">Check metrics in the sidebar</div></div>';
                return;
            }

            el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';

            const [pd, cd] = await Promise.all([
                fetchData(primaryRun.run_id, sel),
                compareRun ? fetchData(compareRun.run_id, sel) : Promise.resolve({})
            ]);

            el.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'charts-grid';
            el.appendChild(grid);

            sel.forEach((metric, i) => {
                const p = pd[metric] || [], c = cd[metric] || [];
                if (p.length || c.length) createChart(grid, metric, p, c, i);
            });
        }

        async function fetchData(runId, metrics) {
            return fetch(`${API}/api/runs/${runId}/data?metrics=${encodeURIComponent(metrics.join(','))}`).then(r => r.json());
        }

        function stats(data) {
            if (!data.length) return null;
            const v = data.map(d => d.y ?? d.value ?? 0);
            const min = Math.min(...v), max = Math.max(...v);
            return { min, max, mean: v.reduce((a, b) => a + b, 0) / v.length, latest: v[v.length - 1], count: v.length };
        }

        function fmt(v) {
            if (v == null) return '—';
            return Math.abs(v) >= 1000 ? v.toFixed(1) : Math.abs(v) >= 1 ? v.toFixed(4) : v.toExponential(3);
        }

        function createChart(container, metric, pd, cd, idx) {
            const ps = stats(pd), cs = cd.length ? stats(cd) : null;
            const ca = COL_A[idx % COL_A.length], cb = COL_B[idx % COL_B.length];
            const isHist = Array.isArray(pd[0]?.value);

            const card = document.createElement('div');
            card.className = 'chart-card';

            const legend = compareRun && !isHist ? `<div class="compare-legend">
        <div class="leg"><div class="leg-line" style="background:${ca}"></div>A: ${primaryRun.run_id.substring(0, 18)}…</div>
        <div class="leg"><div class="leg-line" style="background:${cb}; opacity:0.7"></div>B: ${compareRun.run_id.substring(0, 18)}…</div>
    </div>` : '';

            card.innerHTML = `
        <div class="chart-name">${metric}</div>
        <div class="chart-stats-row">
            <div class="cstat"><span class="cstat-label">current</span><span class="cstat-value" style="color:${ca}">${ps ? fmt(ps.latest) : '—'}</span></div>
            <div class="cstat"><span class="cstat-label">min</span><span class="cstat-value">${ps ? fmt(ps.min) : '—'}</span></div>
            <div class="cstat"><span class="cstat-label">max</span><span class="cstat-value">${ps ? fmt(ps.max) : '—'}</span></div>
            <div class="cstat"><span class="cstat-label">mean</span><span class="cstat-value">${ps ? fmt(ps.mean) : '—'}</span></div>
            ${cs ? `<div class="cstat"><span class="cstat-label" style="color:#a78bfa">B current</span><span class="cstat-value" style="color:${cb}">${fmt(cs.latest)}</span></div>` : ''}
        </div>
        ${legend}
        <div class="chart-hint">scroll zoom · ctrl+drag pan · dbl-click reset</div>
        <div class="chart-wrapper"><canvas id="cv${idx}"></canvas></div>`;
            container.appendChild(card);

            const ctx = document.getElementById(`cv${idx}`);

            if (isHist) {
                const v = pd[pd.length - 1]?.value || [];
                chartInsts[`cv${idx}`] = new Chart(ctx, { type: 'bar', data: { labels: v.map((_, i) => i), datasets: [{ data: v, backgroundColor: ca + '99', borderColor: ca, borderWidth: 1 }] }, options: baseOpts(false) });
            } else {
                const datasets = [{ label: 'A', data: pd.map(d => ({ x: Number(d.x), y: Number(d.y) })), borderColor: ca, backgroundColor: ca + '15', borderWidth: 2, tension: 0.3, pointRadius: 0, pointHoverRadius: 4, fill: !cd.length }];
                if (cd.length) datasets.push({ label: 'B', data: cd.map(d => ({ x: Number(d.x), y: Number(d.y) })), borderColor: cb, backgroundColor: cb + '15', borderWidth: 2, tension: 0.3, pointRadius: 0, pointHoverRadius: 4, borderDash: [5, 3] });
                chartInsts[`cv${idx}`] = new Chart(ctx, { type: 'line', data: { datasets }, options: baseOpts(true) });
            }
        }

        function baseOpts(line) {
            return {
                responsive: true, maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(13,17,23,0.97)', titleColor: '#4a6080', bodyColor: '#c9d8e8', borderColor: '#1e2a38', borderWidth: 1, padding: 9,
                        callbacks: line ? { title: i => `Step: ${i[0].parsed.x.toLocaleString()}` } : {}
                    },
                    zoom: { pan: { enabled: true, mode: 'x', modifierKey: 'ctrl' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } }
                },
                scales: line ? {
                    x: { type: 'linear', title: { display: true, text: 'Step', color: '#4a6080', font: { family: 'JetBrains Mono', size: 10 } }, grid: { color: '#1e2a38' }, ticks: { maxTicksLimit: 8, font: { family: 'JetBrains Mono', size: 10 }, callback: v => v.toLocaleString() } },
                    y: { grid: { color: '#1e2a38' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 6 } }
                } : { x: { grid: { color: '#1e2a38' } }, y: { grid: { color: '#1e2a38' } } }
            };
        }

        // ─── EVENTS ───
        async function loadEvents() {
            if (!primaryRun) return;
            const el = document.getElementById('eventsContent');
            el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
            try {
                const data = await fetch(`${API}/api/runs/${primaryRun.run_id}/events`).then(r => r.json());
                const evs = data.events || [];
                if (!evs.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">◈</div><div class="empty-title">No events</div><div class="empty-sub">No events logged for this run</div></div>'; return; }
                el.innerHTML = `
            <div class="events-header"><span>Time</span><span>Step</span><span>Type</span><span>Severity</span><span>Message</span></div>
            <div class="events-list">${evs.map(e => `
            <div class="event-row">
                <span class="event-time">${e.time}</span>
                <span class="event-step">${Number(e.step).toLocaleString()}</span>
                <span class="event-type">${e.event_type}</span>
                <span class="sev-${e.severity || 'info'}">${e.severity || 'info'}</span>
                <span class="event-msg" title="${e.message}">${e.message}</span>
            </div>`).join('')}
            </div>`;
            } catch (e) { el.innerHTML = '<div class="empty"><span style="font-size:0.75rem;color:var(--muted)">Failed to load events</span></div>'; }
        }

        // ─── REFRESH ───
        function setAutoRefresh() {
            clearInterval(refreshTimer);
            const ms = parseInt(document.getElementById('refreshInterval').value);
            const dot = document.getElementById('liveDot'), lbl = document.getElementById('liveLabel');
            if (ms > 0) {
                dot.classList.remove('off');
                lbl.textContent = `live · ${ms >= 60000 ? ms / 60000 + 'm' : ms / 1000 + 's'}`;
                refreshTimer = setInterval(autoRefresh, ms);
            } else { dot.classList.add('off'); lbl.textContent = 'live off'; }
        }

        async function autoRefresh() {
            if (!primaryRun) return;
            await loadRuns();
            const sel = Array.from(document.querySelectorAll('#metricScroll input:checked')).map(c => c.value);
            if (sel.length) await generateCharts();
            if (document.getElementById('panel-events').classList.contains('active')) await loadEvents();
            showToast('↺ refreshed');
        }

        function manualRefresh() {
            loadRuns();
            if (primaryRun) {
                const sel = Array.from(document.querySelectorAll('#metricScroll input:checked')).map(c => c.value);
                if (sel.length) generateCharts();
            }
            showToast('↺ refreshed');
        }

        // ─── TABS ───
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${name}`).classList.add('active');
            document.getElementById(`panel-${name}`).classList.add('active');
            if (name === 'events' && primaryRun) loadEvents();
        }

        // ─── TOAST ───
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        init();
    </script>
</body>

</html>
