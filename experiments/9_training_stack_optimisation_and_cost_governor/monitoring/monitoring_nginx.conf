# monitoring_nginx.conf
# Deploy: sudo cp monitoring_nginx.conf /etc/nginx/sites-available/monitoring
#         sudo ln -s /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/monitoring
#         sudo nginx -t && sudo systemctl reload nginx

# Rate limit: 20 requests/sec per IP, burst up to 50
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=20r/s;

server {
    listen 80;
    server_name _;   # matches bare IP and any hostname

    # ── Static files ───────────────────────────────────────────────────────────
    # Nginx serves JS/CSS/HTML directly — zero Python involved
    root  /home/ubuntu/monitoring/dashboard;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ @gunicorn;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── API ────────────────────────────────────────────────────────────────────
    # Rate limited, always proxied to gunicorn on localhost
    location /api/ {
        limit_req zone=dashboard burst=50 nodelay;

        proxy_pass            http://127.0.0.1:5050;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    # ── Fallback ───────────────────────────────────────────────────────────────
    # Anything nginx can't find as a static file goes to gunicorn
    location @gunicorn {
        proxy_pass         http://127.0.0.1:5050;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
