[project]
name = "spdl-dataloader"
version = "0.1.0"
description = "High-performance dataloader using Meta SPDL"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pyarrow>=10.0.0",
    "spdl>=0.2.0",
    "numpy>=1.21.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
