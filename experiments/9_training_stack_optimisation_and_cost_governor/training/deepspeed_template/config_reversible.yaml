# DeepSpeed Training Configuration for Reversible Model
# This configuration is optimized for memory-efficient training with reversible architectures

# Data Configuration
data:
  dataset_name: "wikitext"
  dataset_config: "wikitext-2-raw-v1"
  max_length: 64  # Reduced to conserve memory
  tokenized_dataset_path: null
  dataset_cache_dir: null

# Training Configuration
training:
  num_epochs: 1
  max_train_steps: null  # Set to a number for debugging, null for full epoch
  max_eval_steps: null   # Set to a number for debugging, null for full evaluation
  log_interval: 10
  seed: 42
  require_fused_kernels: false
  metrics_jsonl_path: "./logs/metrics.jsonl"

# DeepSpeed Configuration
deepspeed:
  config_path: "deepspeed/zero-2-dense-bf16.json"
  local_rank: -1

# Model Configuration
model:
  tokenizer_name: "Qwen/Qwen2.5-0.5B"
  embedding_type: "kronecker"  # "kronecker" or "standard" (for reversible models)
  require_fused_deltanet_kernel: true

# Checkpoint Configuration
checkpoint:
  output_dir: "./checkpoints_reversible"
  save_checkpoint: true
  checkpoint_interval: 100  # Save checkpoint every N steps
  keep_last_n_checkpoints: 3
  
  # Resume Configuration
  resume_from_checkpoint: null  # Set to checkpoint tag name (e.g., "epoch0_step50")
  resume_step: null             # Step number to resume from

# S3 Configuration
s3:
  enabled: false
  bucket: null                    # Set your S3 bucket name (required if enabled=true)
  prefix: "training/reversible/checkpoints"
  region: "us-east-1"
  cleanup_after_upload: false     # Delete local checkpoints after S3 upload
  
# Generation Configuration
generation:
  test_generation: true
  generation_prompt: "The history of artificial intelligence begins with"

# Notes:
# - Reversible models use ~10x less memory for activations
# - Activation checkpointing is DISABLED (handled by reversible architecture)
# - Dropout is set to 0.0 in model config (required for reversibility)
# - Current settings optimized for 4x L4 (15GB) GPUs
# - Memory breakdown: ~10GB model params + ~4-5GB activations/optimizer states
# - For larger batches/sequences, use g5.12xlarge (4x A10G, 24GB each)
