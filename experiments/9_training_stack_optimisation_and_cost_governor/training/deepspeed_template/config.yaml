# DeepSpeed Training Configuration
# All training parameters are defined here - no command line arguments needed

# Data Configuration
data:
  dataset_name: "wikitext"
  dataset_config: "wikitext-2-raw-v1"
  max_length: 512
  # SPDL Dataloader Settings
  use_dataloader: false
  shard_dir: null
  shard_manifest_path: null
  # GPU Prefetch Settings
  prefetch_to_gpu: false
  prefetch_depth: 2

# Training Configuration
training:
  num_epochs: 1
  max_train_steps: 50
  max_eval_steps: 10
  log_interval: 1
  seed: 42
  enable_system_metrics: true

# DeepSpeed Configuration
deepspeed:
  config_path: "deepspeed/zero-2-moe-oom-fixed.json"
  local_rank: -1

# Model Configuration
model:
  tokenizer_name: "distilgpt2"
  embedding_type: "standard"

# Checkpoint Configuration
checkpoint:
  output_dir: "./checkpoints_moe_test"
  save_checkpoint: false
  checkpoint_interval: 100
  keep_last_n_checkpoints: 3
  resume_from_checkpoint: null
  resume_step: null

# S3 Configuration
s3:
  enabled: false
  bucket: null
  prefix: "training/checkpoints"
  region: "us-east-1"
  cleanup_after_upload: false

# Generation Configuration
generation:
  test_generation: false
  generation_prompt: "The history of artificial intelligence begins with"
  generation_interval: null
