version: '0.2'
owner_team: 'Team 2: Curriculum Architects'
frozen_on: '2026-01-31'
languages:
  primary:
  - en
  secondary:
  - lang: hi
    max_token_share: 0.08
    earliest_stage: 3B
  excluded_langs:
  - zh
  - ja
  - ko
  language_id_requirement:
    provider: dataset_claimed_clean
    min_confidence: 0.9
context_policy:
  min_context_tokens: 4096
  pretrain_context_tokens: 4096
  long_context_target_tokens: 262144
  note: Team 2 ensures curriculum is compatible with later context extension; does
    not implement extension.
growth_schedule:
  stages:
  - name: 1B
    order: 1
    curriculum_profile: base
  - name: 3B
    order: 2
    curriculum_profile: harder_shift_1
  - name: 8B
    order: 3
    curriculum_profile: harder_shift_2
  - name: 70B
    order: 4
    curriculum_profile: final_adaptive_knobs
dataset_interface:
  input_from_team1:
    required_fields:
    - dataset_id
    - license
    - estimated_tokens
    - domain_tags
    - language_tags
    - cleaning_claims
  segmentation_requests_allowed: true
  partial_rejection_allowed: true
  rejection_reasons:
  - language_scope_violation
  - insufficient_cleaning_claims
  - duplication_or_boilerplate_risk
  - benchmark_contamination_risk
  - unknown_license_or_restrictions
guardrails:
  non_negotiables:
  - prevent_overfitting_before_capacity_unlocks
  - long_context_capability_must_appear
  - reasoning_capability_must_appear
  anti_domain_spike:
    rolling_window_tokens: 2000000
    max_domain_share_in_window: 0.25
    smoothing:
      type: ema
      max_weight_delta_per_update: 0.02
  cot_caps:
    max_share_global: 0.06
    max_share_in_band:
      B3: 0.05
      B4: 0.08
      B5: 0.1
  agentic_caps:
    max_share_global: 0.03
    earliest_band: B4
  hindi_caps:
    max_share_global: 0.08
    earliest_stage: 3B
    note: Hindi must not leak into B0/B1 as a byproduct of difficulty heuristics.
  quality_gates:
    enforcement_mode: dataset_claimed
    must_have_claims:
    - language_filtering_en_hi_only_or_equivalent
    - boilerplate_and_spam_reduction
    - deduplication_or_near-dedup
    optional_claims:
    - pii_reduction
    - toxicity_filtering
    fail_action: reject_or_request_resegmentation
stage_profiles:
  base:
    band_weights:
      B0: 0.780992
      B1: 0.219008
      B2: 0.0
      B3: 0.0
      B4: 0.0
      B5: 0.0
    modality_weights:
      general_text: 0.86
      code: 0.12
      cot_reasoning: 0.02
      agentic_traces: 0.0
    notes:
    - Strong language foundation; introduce code early but controlled.
    - Reasoning seed exists (B4/B5 small) to avoid 'never appears'.
  harder_shift_1:
    band_weights:
      B0: 1.0
      B1: 0.0
      B2: 0.0
      B3: 0.0
      B4: 0.0
      B5: 0.0
    modality_weights:
      general_text: 0.78
      code: 0.18
      cot_reasoning: 0.03
      agentic_traces: 0.01
    notes:
    - Shift toward higher difficulty and more code.
    - Hindi can be introduced within caps, staged mainly into B2–B4.
  harder_shift_2:
    band_weights:
      B0: 0.905155
      B1: 0.094845
      B2: 0.0
      B3: 0.0
      B4: 0.0
      B5: 0.0
    modality_weights:
      general_text: 0.68
      code: 0.24
      cot_reasoning: 0.05
      agentic_traces: 0.03
    notes:
    - Ensure reasoning and long-context eval start improving measurably here.
  final_adaptive_knobs:
    band_weights:
      B0: 1.0
      B1: 0.0
      B2: 0.0
      B3: 0.0
      B4: 0.0
      B5: 0.0
    modality_weights:
      general_text: 0.62
      code: 0.28
      cot_reasoning: 0.07
      agentic_traces: 0.03
    notes:
    - Structure frozen; weights may only shift within bounded knobs (see adaptive_knobs).
adaptive_knobs:
  enabled_for_profile: final_adaptive_knobs
  max_band_weight_delta: 0.02
  max_modality_weight_delta: 0.02
  notes:
  - Knobs are bounded and must preserve guardrails.
  - Any change requires logging (who/why) and passes the simulator checks.
