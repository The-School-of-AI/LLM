# Growth Experiment Configuration (4-Phase)
# ==========================================
# Tests all 4 growth methods

# Model Configuration (SmolLM2-style ~70M params)
model:
  vocab_size: 49152
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 12
  num_attention_heads: 9
  num_key_value_heads: 3
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

# MoE Configuration
moe:
  num_experts: 4
  num_experts_per_tok: 2
  router_aux_loss_coef: 0.01

# Training Configuration
training:
  phase1_steps: 100
  phase2_steps: 100
  phase3_steps: 100
  phase4_steps: 100
  
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 20
  max_grad_norm: 1.0
  max_length: 256
  
  checkpoint_every: 500
  save_dir: "./checkpoints"
  log_every: 20
  wandb_project: "growth-experiment"
  wandb_run_name: null

# Dataset Configuration
data:
  dataset_name: "tinystories"
  num_samples: 50000

# Growth Configuration
growth:
  # Phase 1 → 2: Dense → MoE
  dense_to_moe:
    num_experts: 4
    num_experts_per_tok: 2
  
  # Phase 2: Add ghost layers
  add_layers:
    num_new_layers: 4
    init_mode: "identity"
  
  # Phase 3: Scale hidden dimension (zero padding)
  scale_hidden_dim:
    new_hidden_size: 720  # Must be divisible by num_attention_heads (9)
    new_intermediate_size: 1920
    padding_mode: "zero"
  
  # Phase 4: Expert explosion
  add_experts:
    num_new_experts: 4  # 4 → 8 experts
    clone_from: "random"

# Hardware
device: "auto"
seed: 42
