# Growth Experiment Configuration
# ================================

# Model Configuration (SmolLM2-style ~100M params)
model:
  vocab_size: 49152
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 12
  num_attention_heads: 9
  num_key_value_heads: 3
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

# MoE Configuration (for Phase 2+)
moe:
  num_experts: 4
  num_experts_per_tok: 2
  router_aux_loss_coef: 0.01

# Training Configuration
training:
  # Phase 1: Dense training
  phase1_steps: 1000
  # Phase 2: After MoE conversion
  phase2_steps: 1000
  # Phase 3: After scaling
  phase3_steps: 1000
  
  # Common settings
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Sequence length
  max_length: 512
  
  # Checkpointing
  checkpoint_every: 500
  save_dir: "./checkpoints"
  
  # Logging
  log_every: 10
  wandb_project: "growth-experiment"
  wandb_run_name: null  # Auto-generated if null

# Dataset Configuration
data:
  dataset_name: "tiny_shakespeare"  # Options: "dummy", "tiny_shakespeare", "tinystories"
  num_samples: 50000  # For dummy dataset only
  
# Growth Configuration
growth:
  # Dense → MoE (Phase 1 → 2)
  dense_to_moe:
    num_experts: 4
    num_experts_per_tok: 2
  
  # Scaling (Phase 2 → 3)
  # Options: "add_experts", "add_layers", "scale_hidden_dim"
  scaling_method: "add_experts"
  
  add_experts:
    num_new_experts: 2
    clone_from: "random"
  
  add_layers:
    num_new_layers: 4
    init_mode: "identity"
  
  scale_hidden_dim:
    new_hidden_size: 768
    padding_mode: "zero"

# Hardware
device: "auto"  # "auto", "cuda", "mps", "cpu"
seed: 42
