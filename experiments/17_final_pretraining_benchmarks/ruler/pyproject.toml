[project]
name = "ruler-benchmark"
version = "0.1.0"
description = "RULER long-context benchmark runner for NVIDIA L4"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "setuptools",
    "vllm>=0.4.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.23.0",
    "tokenizers>=0.19.0",
    "nltk>=3.8.1",
    "rouge-score>=0.1.2",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
]

[tool.uv]
package = false

# Pull torch from PyTorch CUDA 12.1 index (required for GPU support on L4)
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
