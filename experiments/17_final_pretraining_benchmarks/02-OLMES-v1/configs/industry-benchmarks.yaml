# industry-benchmarks.yaml
# Purpose: Tiered benchmarking configuration based on industry "Gold Standards"
# (Llama 3.1/3.2, Qwen 2.5, OLMo 2).

version: 1

defaults:
  output_root: "./benchmark-results"
  model_type_by_size:
    small: "hf"
    large: "vllm"
  stages:
    common:
      max_new_tokens: 512
      temperature: 0.0
      top_p: 1.0
      seed: 42

stages:
  # 🥉 Tier 1: 1B - 3B Parameters (Small/Fast)
  # Focus on basic signal and core reasoning.
  pretrain_small:
    description: "Essential industry signal for small mobile-scale models."
    backend: "hf"
    benchmarks:
      - name: "world_knowledge"
        tasks:
          - "mmlu::olmes"             # MMLU
          - "triviaqa::olmes"         # TriviaQA
          - "arc_challenge::olmes"    # ARC-Challenge
      - name: "linguistic_diagnostics"
        tasks:
          - "blimp"                   # BLiMP
      - name: "multilingual_indic"
        tasks:
          - "indic_glue"              # IndicGLUE
      - name: "context_window"
        tasks:
          - "niah_4k"
          - "niah_8k"

  # 🥈 Tier 2: 8B Parameters (Standard Milestone)
  # The competitive baseline for most open-weight research.
  pretrain_8b:
    description: "Industry-standard competitive milestone (8B scale)."
    backend: "hf"
    benchmarks:
      - name: "world_knowledge"
        tasks:
          - "mmlu::olmes"             # MMLU
          - "mmlu_pro:mc::none"       # MMLU-Pro
          - "triviaqa::olmes"         # TriviaQA
          - "arc_challenge::olmes"    # ARC-Challenge
      - name: "mathematical_reasoning"
        tasks:
          - "gsm8k::olmes"            # GSM8K
          - "minerva_math::olmes"     # MATH
      - name: "linguistic_diagnostics"
        tasks:
          - "blimp"                   # BLiMP
      - name: "factuality"
        tasks:
          - "truthfulqa:::olmo1"       # TruthfulQA
      - name: "multilingual_indic"
        tasks:
          - "indic_glue"              # IndicGLUE
          - "indic_qa"                # IndicQA
      - name: "context_window"
        tasks:
          - "niah_8k"
          - "niah_16k"
          - "niah_multikey_1"         # RULER – multi-key probe
          - "ruler_vt"                # RULER – Variable Tracking
          - "ruler_cwe"               # RULER – Common Words Extraction

  # 🥇 Tier 3: 70B Parameters (Frontier/Publishable)
  # Comprehensive evaluation for flagship model releases.
  pretrain_70b:
    description: "Frontier-level capability sweep (70B scale)."
    backend: "vllm"
    decoding:
      max_new_tokens: 1024
    benchmarks:
      - name: "world_knowledge"
        tasks:
          - "mmlu::olmes"             # MMLU
          - "mmlu_pro:mc::none"       # MMLU-Pro None
          - "mmlu_pro:cot::none"      # MMLU-Pro COT
          - "triviaqa::olmes"         # TriviaQA
          - "arc_challenge::olmes"    # ARC-Challenge
      - name: "mathematical_reasoning"
        tasks:
          - "gsm8k::olmes"            # GSM8K
          - "minerva_math::olmes"     # MATH / Minerva
      - name: "expert_reasoning"
        tasks:
          - "bbh:cot::olmes"          # BBH (Big Bench Hard)
          - "gpqa_diamond::olmes"     # GPQA Diamond
      - name: "linguistic_diagnostics"
        tasks:
          - "blimp"                   # BLiMP
      - name: "factuality"
        tasks:
          - "truthfulqa::olmes"       # TruthfulQA
      - name: "multilingual_indic"
        tasks:
          - "indic_glue"              # IndicGLUE
          - "indic_qa"                # IndicQA
      - name: "indic_bias"
        enabled: false                # Gated dataset – enable after access granted
        tasks:
          - "indic_bias"              # Indic-Bias / FairITales
      - name: "context_window"
        tasks:
          - "niah_8k"
          - "niah_16k"
          - "niah_32k"
          - "niah_64k"
          - "niah_128k"
          - "niah_256k"
          # RULER (Robustness/Aggregation)
          - "niah_multikey_1"
          - "ruler_vt"
          - "ruler_cwe"
          # LongBench (Reasoning over Long Context)
          - "longbench_narrativeqa"
          - "longbench_qasper"
          - "longbench_hotpotqa"
      # L-Eval – enable once task is registered
      - name: "l_eval"
        enabled: false                # TODO: register L-Eval task suite
        tasks:
          - "l_eval"
      # Tasks requiring custom registration – enable once available
      - name: "aime_2025"
        enabled: false                # TODO: register AIME 2025 task
        tasks:
          - "aime_2025"
      - name: "apps"
        enabled: false                # TODO: register APPS task (needs custom script)
        tasks:
          - "apps"
      - name: "simple_qa"
        enabled: false                # TODO: register SimpleQA_Verified task
        tasks:
          - "simpleqa"

  # 🏅 Tier 4: SFT / Instruct (Alignment & Utility)
  # Final evaluation for chat-aligned and instruction-following models.
  sft:
    description: "Post-SFT: Alignment, Instruction-following, and Factuality evaluation."
    backend: "vllm"
    decoding:
      max_new_tokens: 2048
      temperature: 0.7  # Standard for chat/creative generation
      top_p: 0.95
    benchmarks:
      - name: "alignment_utility"
        tasks:
          - "olmo3:adapt"             # Includes IFEval, AlpacaEval, WildBench
      - name: "ifeval"
        tasks:
          - "ifeval"                  # IFEval (instruction-following)
      - name: "factuality_safety"
        tasks:
          - "truthfulqa::olmes"       # TruthfulQA
      - name: "indic_bias"
        enabled: false                # Gated dataset – enable after access granted
        tasks:
          - "indic_bias"              # Indic-Bias / FairITales
      - name: "multilingual_indic_instruct"
        tasks:
          - "indic_glue"              # IndicGLUE
          - "indic_qa"                # IndicQA
