stage: "70b"
description: "Pre-training benchmarks for 70B model (Frontier Phase)"
benchmarks:
  # Harness Benchmarks
  - name: "MMLU"
    enabled: true
    harness_task: "mmlu"
    shots: 5
    phases: ["pretraining"]

  - name: "TriviaQA"
    enabled: true
    harness_task: "triviaqa"
    shots: 5
    cot: true
    subset: "full"
    phases: ["pretraining"]

  - name: "GPQA Diamond"
    enabled: true
    harness_task: "gpqa_diamond"
    shots: 10
    cot: true
    self_consistency: true
    phases: ["pretraining"]

  - name: "GSM8K"
    enabled: true
    harness_task: "gsm8k"
    shots: 16
    cot: true
    phases: ["pretraining"]

  - name: "BBH (Big Bench Hard)"
    enabled: true
    harness_task: "bbh"
    shots: 3
    cot: true
    tasks: ["all_23_tasks"]
    phases: ["pretraining"]

  - name: "ARC-Challenge"
    enabled: true
    harness_task: "arc_challenge"
    shots: 25
    phases: ["pretraining"]

  - name: "MATH"
    enabled: true
    harness_task: "hendrycks_math"
    shots: 8
    phases: ["pretraining"]

  - name: "MSGS"
    enabled: true
    harness_task: "msgs"
    shots: 0
    phases: ["pretraining"]

  - name: "BLiMP"
    enabled: true
    harness_task: "blimp"
    shots: 0
    tasks: ["wh_island", "adjunct_island", "complex_np_island", "npi_present_1", "npi_present_2", "superlative_quantifiers_1"]
    phases: ["pretraining"]

  - name: "TruthfulQA"
    enabled: true
    harness_task: "truthfulqa"
    mode: "MC2"
    shots: 0
    phases: ["pretraining"]

  - name: "HellaSwag"
    enabled: true
    harness_task: "hellaswag"
    shots: 0
    phases: ["pretraining"]

  - name: "Winogrande"
    enabled: true
    harness_task: "winogrande"
    shots: 0
    phases: ["pretraining"]

  # Custom Benchmarks Pipeline
  - name: "AIME 2025"
    enabled: true
    custom_script: "scripts/aime2025.py"
    paradigm: "8-shot CoT"
    phases: ["pretraining"]

  - name: "IndicGLUE"
    enabled: true
    custom_script: "scripts/indic_glue.py"
    tasks: ["indic-wnli", "indic-copa", "xquad-in"]
    phases: ["pretraining"]

  - name: "IndicQA"
    enabled: true
    custom_script: "scripts/indic_qa.py"
    phases: ["pretraining"]
