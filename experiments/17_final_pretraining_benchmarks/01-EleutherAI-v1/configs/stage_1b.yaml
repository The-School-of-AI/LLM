stage: "1b"
description: "Pre-training benchmarks for 1B model (Base Capability Profile)"
benchmarks:
  # Standard Harness Benchmarks
  - name: "MMLU"
    enabled: true
    harness_task: "mmlu"
    shots: 0
    subjects: ["elementary_mathematics", "high_school_biology", "high_school_chemistry", "high_school_physics", "high_school_computer_science", "high_school_us_history", "high_school_geography", "high_school_psychology"]
    phases: ["pretraining"]

  - name: "TriviaQA"
    enabled: true
    harness_task: "triviaqa"
    shots: 0
    phases: ["pretraining"]

  - name: "GSM8K"
    enabled: true
    harness_task: "gsm8k"
    shots: 5
    phases: ["pretraining"]

  - name: "BBH (Big Bench Hard)"
    enabled: true
    harness_task: "bbh_zeroshot"
    shots: 0
    tasks: ["boolean_expressions", "sports_understanding", "word_sorting", "date_understanding", "object_counting"]
    phases: ["pretraining"]

  - name: "ARC-Challenge"
    enabled: true
    harness_task: "arc_challenge"
    shots: 0
    phases: ["pretraining"]

  - name: "MATH"
    enabled: true
    harness_task: "hendrycks_math"
    shots: 0
    phases: ["pretraining"]

  - name: "IFEval"
    enabled: true
    harness_task: "ifeval"
    shots: 0
    phases: ["pretraining"]

  - name: "HumanEval"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/humaneval.py"
    shots: 5
    phases: ["pretraining"]

  - name: "BLiMP"
    enabled: true
    harness_task: "blimp"
    shots: 0
    tasks: ["regular_plural_subject_verb_agreement_1", "determiner_noun_agreement_with_adj_2", "distractor_agreement_relative_clause"]
    phases: ["pretraining"]

  - name: "TruthfulQA"
    enabled: true
    harness_task: "truthfulqa"
    mode: "MC1"
    shots: 0
    phases: ["pretraining"]

  - name: "HellaSwag"
    enabled: true
    harness_task: "hellaswag"
    shots: 5
    phases: ["pretraining"]

  - name: "Winogrande"
    enabled: true
    harness_task: "winogrande"
    shots: 5
    phases: ["pretraining"]

  - name: "PIQA"
    enabled: true
    harness_task: "piqa"
    shots: 0
    phases: ["pretraining"]

  - name: "LAMBADA"
    enabled: true
    harness_task: "lambada_openai"
    shots: 0
    phases: ["pretraining"]

  # Custom Benchmarks Pipeline
  - name: "SimpleQA_Verified"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/simpleqa.py"
    phases: ["pretraining"]

  - name: "AIME 2025"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/aime2025.py"
    paradigm: "0-shot (Baseline)"
    phases: ["pretraining"]

  - name: "IndicGLUE"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/indic_glue.py"
    tasks: ["iitp-movie-reviews", "bbc-news-articles", "article-genre-classification"]
    phases: ["pretraining"]

  - name: "IndicQA"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/indic_qa.py"
    phases: ["pretraining"]

  - name: "L-Eval"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/leval.py"
    phases: ["pretraining"]

  - name: "RULER"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/ruler.py"
    tasks: ["niah_single_1"]
    phases: ["pretraining"]

  - name: "Indic-Bias (FairITales)"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/indic_bias.py"
    phases: ["pretraining"]
