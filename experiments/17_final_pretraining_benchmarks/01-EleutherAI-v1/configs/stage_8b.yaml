stage: "8b"
description: "Pre-training benchmarks for 8B model (Frontier Phase Diagnostics)"
base_config: "base_benchmarks.yaml"
benchmarks:
  - name: "MMLU"
    subjects: 
      - "elementary_mathematics"
      - "high_school_biology"
      - "high_school_chemistry"
      - "high_school_physics"
      - "high_school_computer_science"
      - "high_school_us_history"
      - "high_school_geography"
      - "high_school_psychology"
      - "high_school_mathematics"
      - "high_school_government_and_politics"
      - "astronomy"
      - "world_religions"
      - "philosophy"
      - "logical_fallacies"
      - "moral_disputes"
      - "anatomy"
      - "business_ethics"
      - "clinical_knowledge"
      - "conceptual_physics"
      - "econometrics"
      - "global_facts"
      - "juris_prudence"
      - "nutrition"
      - "sociology"
      - "us_foreign_policy"
    limit: 150

  - name: "MMLU-Pro"
    limit: 150

  - name: "TriviaQA"
    limit: 150

  - name: "GSM8K"
    limit: 150

  - name: "ARC-Challenge"
    limit: 500
    shots: 25

  - name: "BBH (Big Bench Hard)"
    limit: 150
    shots: 5

  - name: "IFEval"
    limit: 150

  - name: "HumanEval"
    limit: 75

  - name: "SimpleQA_Verified"
    limit: 75

  - name: "GPQA Diamond"
    enabled: true
    harness_task: "gpqa_diamond_n_shot"
    shots: 0
    limit: 50
    phases: ["pretraining"]

  - name: "AIME 2025"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/aime2025.py"
    paradigm: "8-shot CoT"
    limit: 75
    phases: ["pretraining"]

  - name: "L-Eval"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/leval.py"
    limit: 30
    phases: ["pretraining"]

  - name: "RULER"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/ruler.py"
    tasks: ["longchat_qa"]
    limit: 30
    phases: ["pretraining"]

  - name: "SWE-bench Verified"
    enabled: true
    custom_script: "01-EleutherAI-v1/src/custom-scripts/swebench.py"
    limit: 30
    phases: ["pretraining"]
