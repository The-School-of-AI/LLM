task: indicifeval_trans_hi_chat
# Same dataset as indicifeval_trans_hi, but prompts are wrapped in Qwen chat format.
dataset_path: ai4bharat/IndicIFEval
dataset_name: indicifeval-trans
output_type: generate_until
test_split: hi
num_fewshot: 0
doc_to_text: !function utils.doc_to_text_qwen_chat
doc_to_target: 0
generation_kwargs:
  # Stop at the chat turn delimiter.
  until: ["<|im_end|>"]
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1280
process_results: !function utils.process_results_hi
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
metadata:
  version: 4.0
