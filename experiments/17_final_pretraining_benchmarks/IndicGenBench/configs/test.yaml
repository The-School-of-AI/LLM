# Full evaluation: all languages, full test split
data:
  split: test
  languages: [all]
  max_samples_per_lang: null

model:
  backend: hf
  model_name_or_path: null  # specify via CLI: --model-name <path>
  device: cuda
  max_new_tokens: 256

run:
  tasks: [crosssum, flores, xquad, xorqa]
  seed: 42
