[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-contamination-scanner"
version = "0.1.0"
description = "Data contamination detection for LLM training datasets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "tqdm",
    "datasketch",
    "rich",
    "datasets",
    "boto3",
]

[project.optional-dependencies]
# Semantic detection layer (dense embeddings + FAISS vector search).
# Required only for the third detection layer; N-gram + MinHash work without it.
# Install with:  uv sync --extra semantic
semantic = [
    "faiss-cpu",
    "sentence-transformers",
]
