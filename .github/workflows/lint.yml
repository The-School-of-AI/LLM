name: Lint Code Base

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  super-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter (scoped)
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          DISABLE_ERRORS: false

          # Language / docs only
          VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true

          # Explicitly disable infra/security
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_DOCKERFILE: false
          VALIDATE_TERRAFORM: false

      - name: Comment lint fix instructions on PR
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lint-failure
          message: |
            ❌ **Lint checks failed**

            ### 🔧 Fix locally
            ```bash
            pre-commit run --all-files
            ```

            📌 See inline annotations on this PR for details.
