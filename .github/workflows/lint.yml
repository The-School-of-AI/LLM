name: Lint Code Base

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write

jobs:
  super-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        id: lint
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false

          # ✅ ALLOW-LIST ONLY (no false flags anywhere)
          VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true

      - name: Comment lint fix instructions on PR
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lint-failure
          message: |
            ❌ **Lint checks failed**

            Please fix the issues locally and push updates.

            **Run locally:**
            ```bash
            pre-commit run --all-files
            ```

            **Python:**
            ```bash
            ruff check . --fix
            ruff format .
            ```

            **Docs / Markdown:**
            ```bash
            pymarkdown scan .
            ```

            Then:
            ```bash
            git commit -am "fix: address lint issues"
            git push
            ```
