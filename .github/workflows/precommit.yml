name: Lint Code Base
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write
jobs:
  super-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Super-Linter
        id: lint
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          DISABLE_ERRORS: false
      - name: Comment lint fix instructions on PR
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lint-failure
          message: |
            ❌ **Lint checks failed**

            Please fix the issues locally and push updates.

            ### 🔧 How to fix locally

            **Run all linters (recommended):**
            ```bash
            pre-commit run --all-files
            ```

            **Python (common failures):**
            ```bash
            # Auto-format
            black .

            # Sort imports
            isort .

            # Lint (fast, modern)
            ruff check .

            # Strict lint (if enabled)
            pylint path/to/module.py
            ```

            **YAML / JSON / Markdown:**
            ```bash
            yamllint .
            markdownlint .
            ```

            **Shell / Docker:**
            ```bash
            shellcheck .
            hadolint Dockerfile
            ```

            📌 See inline PR annotations for exact files and lines.

            After fixing:
            ```bash
            git commit -am "fix: address lint issues"
            git push
            ```
