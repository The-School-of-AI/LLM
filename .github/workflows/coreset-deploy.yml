name: Coreset CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install uv & sync
        run: |
          python -m pip install --upgrade pip
          pip install uv || true
          uv sync --frozen

      - name: Run tests
        run: uv run pytest experiments/3_coreset_engineering/tests -v --maxfail=1

      - name: Build manifests (optional)
        run: |
          # If your workflow produces manifests, run the builder here.
          # Uncomment and adapt the command below when ready to produce manifests in CI.
          # uv run experiments/3_coreset_engineering/scripts/coreset_builder.py \
          #   --config experiments/3_coreset_engineering/configs/curriculum.yaml \
          #   --data experiments/3_coreset_engineering/data/input \
          #   --output output/manifests
          echo "Skipping manifest build (enable when ready)"

      - name: Validate manifests
        run: |
          if [ -d output/manifests ]; then
            python experiments/3_coreset_engineering/scripts/validate_manifests.py --manifest-dir output/manifests
          else
            echo "No manifests directory present; skipping validation."
          fi

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreset-artifacts
          path: |
            experiments/3_coreset_engineering/htmlcov
            output/manifests
name: Coreset Engineering - Build, Test & Deploy to AWS

on:
  push:
    branches: [main, develop]
    paths:
      - 'experiments/3_coreset_engineering/**'
      - '.github/workflows/coreset-deploy.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'experiments/3_coreset_engineering/**'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: coreset-engineering
  ARTIFACT_BUCKET: llm-coreset-artifacts

jobs:
  test:
    name: Test Coreset Engineering
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          cd experiments/3_coreset_engineering
          uv sync

      - name: Run linting (ruff)
        run: |
          cd experiments/3_coreset_engineering
          uv run ruff check src tests

      - name: Run type checking (mypy)
        run: |
          cd experiments/3_coreset_engineering
          uv run mypy src/coreset_engine --ignore-missing-imports

      - name: Run regression tests
        run: |
          cd experiments/3_coreset_engineering
          uv run pytest tests/ -v --cov=src/coreset_engine --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./experiments/3_coreset_engineering/coverage.xml
          flags: coreset-engineering
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f experiments/3_coreset_engineering/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --build-arg PYTHON_VERSION=3.12 \
            experiments/3_coreset_engineering/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Output image URI
        run: |
          echo "ECR_IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_ENV

  deploy-staging:
    name: Deploy to AWS Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://coreset-staging.llm.internal

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS (Staging)
        run: |
          aws ecs update-service \
            --cluster coreset-staging \
            --service coreset-builder \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster coreset-staging \
            --services coreset-builder \
            --region ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          aws lambda invoke \
            --function-name coreset-staging-validation \
            --region ${{ env.AWS_REGION }} \
            /tmp/response.json
          cat /tmp/response.json

  deploy-production:
    name: Deploy to AWS Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://coreset.llm.internal

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment ticket (optional)
        run: |
          echo "Deployment to production initiated for commit: ${{ github.sha }}"
          echo "See: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

      - name: Deploy to ECS (Production)
        run: |
          aws ecs update-service \
            --cluster coreset-production \
            --service coreset-builder \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster coreset-production \
            --services coreset-builder \
            --region ${{ env.AWS_REGION }}

      - name: Run production validation
        run: |
          aws lambda invoke \
            --function-name coreset-production-validation \
            --region ${{ env.AWS_REGION }} \
            /tmp/response.json
          cat /tmp/response.json

      - name: Post deployment notification
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Notify team via SNS/Slack webhook"
