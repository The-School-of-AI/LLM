# Training log rotation template.
#
# Update this path to match your deployment checkout path.
# Recommended install path on host: /etc/logrotate.d/llm-training
# | `size 200M` | Archive when drawer hits 200MB |
# | `daily` | Also archive once per day regardless |
# | `rotate 10` | Keep last 10 archives, delete older ones |
# | `compress` | Zip up old archives to save space |
# | `delaycompress` | Don't zip the most recent archive — keep it readable |
# | `missingok` | Don't panic if a file doesn't exist |
# | `notifempty` | Don't archive empty files |
# | `copytruncate` | Photocopy and empty — never move |
# | `sharedscripts` | Do housekeeping once for all files, not separately |

path/to/training_combined.log
path/to/rank_issues.log
path/to/nccl.*.log {
    size 200M
    rotate 10
    daily
    missingok
    notifempty
    compress
    delaycompress
    copytruncate    
    sharedscripts
}

